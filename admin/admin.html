<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Clans vs Society — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  body{ padding:0; }
  .wrap{ max-width:1180px; margin:0 auto; padding:1.4rem; }
  .bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem; border-bottom:1px solid var(--line); padding-bottom:1rem; }
  .bar h1{ font-family:'Cinzel',serif; font-size:1.1rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--parchment); }
  .bar a{ font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ash); text-decoration:none; border:1px solid var(--line); padding:0.35rem 0.7rem; }
  .bar a:hover{ color:var(--bone); border-color:var(--brass-dim); }

  .layout{ display:grid; grid-template-columns:320px 1fr; gap:1.2rem; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); padding:1rem; }
  .label{ font-family:'JetBrains Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--brass); margin-bottom:0.5rem; display:block; }
  input[type=search]{ width:100%; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--bone); font-family:'EB Garamond',serif; font-size:0.95rem; padding:0.6rem 0.8rem; margin-bottom:0.8rem; }
  input[type=search]:focus{ outline:none; border-color:var(--brass-dim); }

  .plist{ display:flex; flex-direction:column; max-height:68vh; overflow-y:auto; }
  .prow{ text-align:left; background:none; border:none; border-bottom:1px solid rgba(176,141,69,0.08); color:var(--bone); padding:0.6rem 0.4rem; cursor:pointer; font:inherit; }
  .prow:hover{ background:rgba(176,141,69,0.06); }
  .prow.active{ background:rgba(139,58,42,0.15); }
  .pname{ display:block; font-size:0.98rem; }
  .pmeta{ display:block; font-family:'JetBrains Mono',monospace; font-size:0.62rem; color:var(--ash); }

  .head{ margin-bottom:1rem; }
  .head h2{ font-family:'Cinzel',serif; font-size:1.05rem; color:var(--parchment); }
  .facts{ display:flex; gap:1.2rem; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--ash); margin-top:0.3rem; }
  .facts b{ color:var(--bone); font-weight:500; }
  .flag{ color:var(--rust-bright); }

  .tabs{ display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  .tab{ font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; padding:0.45rem 0.8rem; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--ash); cursor:pointer; }
  .tab:hover{ border-color:var(--brass-dim); }
  .tab.active{ border-color:var(--rust-bright); color:var(--parchment); background:rgba(139,58,42,0.15); }
  .tab .n{ margin-left:0.45rem; color:var(--brass); }

  .entry{ display:grid; grid-template-columns:150px 90px 1fr; gap:0.8rem; padding:0.5rem 0; border-bottom:1px solid rgba(176,141,69,0.08); font-size:0.92rem; }
  @media (max-width:620px){ .entry{ grid-template-columns:1fr; gap:0.1rem; } }
  .when{ font-family:'JetBrains Mono',monospace; font-size:0.64rem; color:var(--ash); padding-top:0.2rem; }
  .cat{ font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); padding-top:0.2rem; }
  .msg{ color:var(--bone); overflow-wrap:anywhere; }
  .muted{ color:var(--ash); font-style:italic; padding:1rem 0; }
  .more{ margin-top:1rem; font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; padding:0.55rem 1rem; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--bone); cursor:pointer; }
  .more:hover{ border-color:var(--brass-dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Admin · Player Audit Log</h1>
    <a href="/dashboard">Back to game</a>
  </div>

  <div class="layout">
    <div class="panel">
      <label class="label" for="q">Find a player</label>
      <input type="search" id="q" placeholder="Character, username or email" autocomplete="off">
      <div class="plist" id="plist"><div class="muted">Loading…</div></div>
    </div>

    <div class="panel" id="detail">
      <div class="muted">Select a player to view their activity.</div>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  // Everything from the server goes through textContent / esc() — log messages
  // include player-chosen names, so nothing is ever injected as raw HTML.
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = iso => iso ? new Date(iso).toLocaleString([], { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' }) : '—';

  let selectedId = null;
  let category = null;      // null = all
  let entries = [];
  let nextBefore = null;
  let searchTimer = null;

  async function api(url){
    const res = await fetch(url, { credentials:'same-origin' });
    if (res.status === 401 || res.status === 403) { location.href = '/'; throw new Error('auth'); }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function loadPlayers(){
    try {
      const { players } = await api('/api/admin/players?q=' + encodeURIComponent($('q').value.trim()));
      $('plist').innerHTML = players.length ? players.map(p => `
        <button class="prow${p.id === selectedId ? ' active' : ''}" data-id="${p.id}">
          <span class="pname">${esc(p.characterName || p.username)}</span>
          <span class="pmeta">${esc(p.characterClass || 'no class')} · Lv ${p.stats ? p.stats.level : '—'} · last seen ${esc(fmt(p.lastLoginAt))}</span>
        </button>`).join('') : '<div class="muted">No players found.</div>';
    } catch (e) { if (e.message !== 'auth') $('plist').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
  }

  async function loadAudit(append){
    if (!selectedId) return;
    const params = new URLSearchParams({ limit: '50' });
    if (category) params.set('category', category);
    if (append && nextBefore) params.set('before', nextBefore);
    try {
      const data = await api(`/api/admin/players/${selectedId}/audit?${params}`);
      entries = append ? entries.concat(data.entries) : data.entries;
      nextBefore = data.nextBefore;
      render(data);
    } catch (e) { if (e.message !== 'auth') $('detail').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
  }

  function render(data){
    const p = data.player, s = p.stats || {};
    const total = data.categories.reduce((n, c) => n + c.count, 0);
    $('detail').innerHTML = `
      <div class="head">
        <h2>${esc(p.characterName || p.username)}</h2>
        <div class="facts">
          <span>Class <b>${esc(p.characterClass || '—')}</b></span>
          <span>Level <b>${s.level ?? '—'}</b></span>
          <span>Gold <b>${s.gold ?? '—'}</b></span>
          <span>Email <b>${esc(p.email || '—')}</b></span>
          <span>Joined <b>${esc(fmt(p.createdAt))}</b></span>
          <span>Last login <b>${esc(fmt(p.lastLoginAt))}</b></span>
          ${s.inJail ? '<span class="flag">IN JAIL</span>' : ''}
          ${s.inHospital ? '<span class="flag">IN HOSPITAL</span>' : ''}
        </div>
      </div>
      <div class="tabs">
        <button class="tab${category === null ? ' active' : ''}" data-cat="">All<span class="n">${total}</span></button>
        ${data.categories.map(c => `<button class="tab${category === c.category ? ' active' : ''}" data-cat="${esc(c.category)}">${esc(c.category)}<span class="n">${c.count}</span></button>`).join('')}
      </div>
      <div id="entries">${entries.length ? entries.map(e => `
        <div class="entry">
          <span class="when">${esc(fmt(e.createdAt))}</span>
          <span class="cat">${esc(e.category)}</span>
          <span class="msg">${esc(e.message)}</span>
        </div>`).join('') : '<div class="muted">No activity recorded.</div>'}</div>
      ${nextBefore ? '<button class="more" id="more">Load older</button>' : ''}`;
  }

  $('plist').addEventListener('click', e => {
    const row = e.target.closest('.prow'); if (!row) return;
    selectedId = parseInt(row.dataset.id, 10);
    category = null; entries = []; nextBefore = null;
    document.querySelectorAll('.prow').forEach(r => r.classList.toggle('active', r === row));
    loadAudit(false);
  });

  $('detail').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (tab) { category = tab.dataset.cat || null; nextBefore = null; loadAudit(false); return; }
    if (e.target.id === 'more') loadAudit(true);
  });

  $('q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadPlayers, 250); });

  loadPlayers();
</script>
</body>
</html>
