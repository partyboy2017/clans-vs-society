<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clans vs Society — Realm Keepers</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C1A17;--p:#25211C;--p2:#2C2620;--parch:#DCCEA6;--rust:#8B3A2A;--rustb:#B0492F;--brass:#B08D45;--brassd:#8A6F3A;--bone:#ECE4D2;--ash:#93897A;--green:#5C9E70;--line:rgba(176,141,69,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--bone);font:17px/1.5 'EB Garamond',serif;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.6rem;border-bottom:1px solid var(--line);background:rgba(28,26,23,.95);position:sticky;top:0;z-index:5}
h1{font:600 .95rem 'Cinzel',serif;letter-spacing:.1em;text-transform:uppercase;color:var(--parch)}
h1 span{color:var(--rustb)}
a.back{font:.68rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);text-decoration:none;border:1px solid var(--line);padding:.35rem .7rem}
main{padding:1.6rem;max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:1.5rem;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.tab{font:.72rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--ash);padding:0 0 .9rem;cursor:pointer}
.tab.on{color:var(--bone);border-color:var(--rustb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.4rem}
.card{background:var(--p);border:1px solid var(--line);padding:1rem 1.1rem}
.lbl{font:.6rem 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.big{font:600 1.7rem 'Cinzel',serif;color:var(--parch);margin-top:.3rem}
.title{font:.82rem 'Cinzel',serif;letter-spacing:.1em;text-transform:uppercase;color:var(--parch);margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--bone);font:.95rem 'EB Garamond',serif;padding:.5rem .7rem;width:100%}
input:focus,select:focus{outline:0;border-color:var(--brassd)}
.bar{display:flex;gap:.7rem;margin-bottom:1rem}
.btn{font:.66rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:.55rem 1rem;border:0;background:var(--rust);color:var(--bone);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--rustb)}
.btn.ghost{background:transparent;border:1px solid var(--brassd);color:var(--brass)}
.btn.sm{padding:.3rem .7rem}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--line)}
th{font:.6rem 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);padding:.65rem .9rem;text-align:left;border-bottom:1px solid var(--line);font-weight:400}
td{padding:.6rem .9rem;border-bottom:1px solid rgba(176,141,69,.08);font-size:.92rem}
.nm{font-family:'Cinzel',serif;color:var(--parch)}
.tag{font:.58rem 'JetBrains Mono',monospace;letter-spacing:.08em;padding:.1rem .4rem;border:1px solid var(--brassd);color:var(--brass);margin-left:.4rem}
.tag.bad{color:var(--rustb);border-color:var(--rustb)}
.log{padding:.5rem 0;border-bottom:1px solid rgba(176,141,69,.08);font-size:.9rem;display:flex;gap:.8rem}
.log .t{font:.62rem 'JetBrains Mono',monospace;color:var(--ash);min-width:90px;padding-top:.15rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:1rem}
.ov.on{display:flex}
.modal{background:var(--p);border:1px solid var(--line);padding:1.6rem;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin:1rem 0}
.fields label{font:.58rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:.25rem}
.row{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}
#toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--p2);border:1px solid var(--brassd);padding:.7rem 1.1rem;font:.72rem 'JetBrains Mono',monospace;opacity:0;transition:.2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
@media(max-width:600px){.fields{grid-template-columns:1fr 1fr}main{padding:1rem}}
</style>
</head>
<body>
<header><h1>Clans vs Society <span>· Realm Keepers</span></h1><a class="back" href="/dashboard">← Back to Realm</a></header>
<main>
<div class="tabs">
  <button class="tab on" data-t="overview">Overview</button>
  <button class="tab" data-t="players">Players</button>
  <button class="tab" data-t="items">Items</button>
  <button class="tab" data-t="activity">Activity</button>
  <button class="tab" data-t="audit">Audit Log</button>
</div>
<section id="overview"></section>
<section id="players" hidden></section>
<section id="items" hidden></section>
<section id="activity" hidden></section>
<section id="audit" hidden></section>
</main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
async function api(url, method='GET', body){
  const r = await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d = await r.json().catch(()=>({}));
  if(r.status===403 && !d.denied){location.href='/';throw 0}
  if(!r.ok){toast(d.error||'Error');throw new Error(d.error)}
  return d;
}
let ME = { role: 'player', permissions: [], id: 0 };
const can = p => ME.permissions.includes(p);
const closeModal = () => $('#ov').classList.remove('on');
$('#ov').onclick = e => { if(e.target.id==='ov') closeModal(); };
function openModal(html){ $('#modal').innerHTML = html; $('#ov').classList.add('on'); }

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===b));
  ['overview','players','items','activity','audit'].forEach(t => $('#'+t).hidden = t !== b.dataset.t);
  ({overview:loadOverview,players:loadPlayers,items:loadItems,activity:loadActivity,audit:()=>loadAudit()})[b.dataset.t]();
});

// ── Overview
async function loadOverview(){
  const d = await api('/api/admin/overview');
  const stat = (l,v) => `<div class="card"><div class="lbl">${l}</div><div class="big">${esc(v)}</div></div>`;
  $('#overview').innerHTML = `<div class="grid">${stat('Players',d.users)}${stat('Houses',d.houses)}${stat('Item types',d.items)}
    ${stat('Active fights',d.activeFights)}${stat('Gold in economy',d.totalGold.toLocaleString())}${stat('Avg level',d.avgLevel)}</div>
    <div class="card"><div class="title">Newest Lords</div>${d.recent.map(u=>`<div class="log"><span class="t">${fmt(u.createdAt)}</span>
    <span>${esc(u.characterName||'(unnamed)')} ${u.characterClass?`<span class="tag">${esc(u.characterClass)}</span>`:''}</span></div>`).join('')}</div>`;
}

// ── Players
let players = [];
async function loadPlayers(q=''){
  players = await api('/api/admin/players?q='+encodeURIComponent(q));
  $('#players').innerHTML = `<div class="bar"><input id="pq" placeholder="Search by name or email..." value="${esc(q)}"><button class="btn" id="pgo">Search</button></div>
  <div class="wrap"><table><thead><tr><th>Lord</th><th>Class</th><th>Lvl</th><th>Gold</th><th>Last login</th><th></th></tr></thead><tbody>
  ${players.map(p=>`<tr><td><span class="nm">${esc(p.characterName||'(unnamed)')}</span>
    ${p.role&&p.role!=='player'?`<span class="tag">${esc(p.role.toUpperCase())}</span>`:''}
    ${p.stats?.inJail?'<span class="tag bad">JAIL</span>':''}${p.stats?.inHospital?'<span class="tag bad">HOSPITAL</span>':''}
    <div class="mono" style="font-size:.62rem;color:var(--ash)">${esc(p.email||'')} · #${p.id}</div></td>
    <td>${esc(p.characterClass||'—')}</td><td class="mono">${p.stats?.level??'—'}</td>
    <td class="mono" style="color:var(--brass)">${(p.stats?.gold??0).toLocaleString()}</td><td class="mono" style="font-size:.7rem">${fmt(p.lastLoginAt)}</td>
    <td><button class="btn ghost sm" onclick="editPlayer(${p.id})">Manage</button></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#pgo').onclick = () => loadPlayers($('#pq').value);
  $('#pq').onkeydown = e => { if(e.key==='Enter') loadPlayers($('#pq').value); };
}
const FIELDS = ['level','xp','statPoints','strength','defense','speed','dexterity','intelligence','health','maxHealth','energy','maxEnergy','gold','wagonTier'];
async function editPlayer(id){
  const p = players.find(x=>x.id===id), s = p.stats || {};
  const items = await api('/api/admin/items');
  openModal(`<div class="title">${esc(p.characterName||'Player')} <span class="tag">#${p.id}</span></div>
  <div class="fields">${FIELDS.map(f=>`<div><label>${f}</label><input type="number" min="0" id="f-${f}" value="${s[f]??0}"></div>`).join('')}</div>
  <div class="row">${can('players.edit_stats')?'<button class="btn" id="save">Save stats</button>':''}${can('players.release')?'<button class="btn ghost" id="rel">Release jail / hospital</button>':''}</div>
  ${can('players.grant_item')?`<div class="title" style="margin-top:1.4rem">Grant item</div>
  <div class="row" style="margin-top:0"><select id="gi" style="flex:2">${items.map(i=>`<option value="${i.id}">${esc(i.name)} (${esc(i.type)})</option>`).join('')}</select>
  <input id="gq" type="number" min="1" value="1" style="flex:.6"><button class="btn" id="grant">Grant</button></div>`:''}
  ${can('roles.manage')?roleSection(p):''}
  <div class="row"><button class="btn ghost" onclick="showAudit(${p.id})">View audit log</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  if ($('#save')) $('#save').onclick = async () => {
    const body = {}; FIELDS.forEach(f => body[f] = $('#f-'+f).value);
    await api(`/api/admin/players/${id}/stats`,'POST',body); toast('Stats saved'); loadPlayers($('#pq')?.value||'');
  };
  if ($('#rel')) $('#rel').onclick = async () => { await api(`/api/admin/players/${id}/release`,'POST'); toast('Released'); loadPlayers(); closeModal(); };
  if ($('#grant')) $('#grant').onclick = async () => { await api(`/api/admin/players/${id}/grant-item`,'POST',{itemId:$('#gi').value,quantity:$('#gq').value}); toast('Item granted'); };
  if ($('#rolesave')) $('#rolesave').onclick = async () => {
    const role = $('#role-sel').value;
    if (role === p.role) return toast('No change');
    if (role === 'admin' && !confirm(`Make ${p.characterName||'this player'} an ADMIN? They will be able to edit stats, grant items and manage roles.`)) return;
    await api(`/api/admin/players/${id}/role`,'POST',{role}); toast('Role set to '+role); closeModal(); loadPlayers($('#pq')?.value||'');
  };
}
function roleSection(p){
  const locked = p.id === ME.id ? 'You cannot change your own role.' : p.bootstrapAdmin ? 'Set in ADMIN_EMAILS (change it there).' : '';
  return `<div class="title" style="margin-top:1.4rem">Role</div>
  <div class="row" style="margin-top:0"><select id="role-sel" style="flex:2" ${locked?'disabled':''}>
    ${['player','moderator','admin'].map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${r}</option>`).join('')}</select>
    <button class="btn" id="rolesave" ${locked?'disabled style="opacity:.4;cursor:not-allowed"':''}>Set role</button></div>
  <div class="lbl" style="margin-top:.5rem;text-transform:none;letter-spacing:.02em">${locked||'Moderators can view and release players. Admins can edit everything.'}</div>`;
}

// ── Items
let items = [];
async function loadItems(){
  items = await api('/api/admin/items');
  $('#items').innerHTML = `<div class="bar">${can('items.manage')?'<button class="btn" onclick="editItem()">+ New item</button>':''}</div>
  <div class="wrap"><table><thead><tr><th>Name</th><th>Type</th><th>Effect</th><th>Price</th><th></th></tr></thead><tbody>
  ${items.map(i=>`<tr><td class="nm">${esc(i.name)}</td><td>${esc(i.type)}</td><td class="mono" style="font-size:.7rem">${esc(i.effect||'—')}</td>
  <td class="mono" style="color:var(--brass)">${i.basePrice}g</td><td>${can('items.manage')?`<button class="btn ghost sm" onclick="editItem(${i.id})">Edit</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function editItem(id){
  const i = items.find(x=>x.id===id) || {name:'',description:'',type:'material',effect:'',basePrice:1,icon:''};
  openModal(`<div class="title">${id?'Edit':'New'} item</div>
  <div style="display:grid;gap:.7rem">
  <div><label class="lbl">Name</label><input id="i-name" value="${esc(i.name)}"></div>
  <div><label class="lbl">Description</label><input id="i-description" value="${esc(i.description)}"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">
    <div><label class="lbl">Type</label><select id="i-type">${['consumable','material','crafting','weapon','armour'].map(t=>`<option ${t===i.type?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label class="lbl">Base price</label><input id="i-basePrice" type="number" min="0" value="${i.basePrice}"></div></div>
  <div><label class="lbl">Effect (e.g. health:30,energy:20)</label><input id="i-effect" value="${esc(i.effect)}"></div>
  <div><label class="lbl">Icon path</label><input id="i-icon" value="${esc(i.icon||'')}" placeholder="/assets/items/..."></div></div>
  <div class="row"><button class="btn" id="isave">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  $('#isave').onclick = async () => {
    const b = {}; ['name','description','type','effect','basePrice','icon'].forEach(k => b[k] = $('#i-'+k).value);
    await api(id?`/api/admin/items/${id}`:'/api/admin/items', id?'PUT':'POST', b);
    toast('Item saved'); closeModal(); loadItems();
  };
}

// ── Activity
async function loadActivity(){
  const d = await api('/api/admin/activity');
  $('#activity').innerHTML = `<div class="card"><div class="title">Latest 100 events</div>${d.entries.map(e=>
    `<div class="log"><span class="t">${fmt(e.createdAt)}</span><span><b class="nm">${esc(e.user?.characterName||'?')}</b>
    <span class="tag">${esc(e.category)}</span> ${esc(e.message)}</span></div>`).join('')||'<i style="color:var(--ash)">Nothing yet.</i>'}</div>`;
}

// ── Audit log
const AUDIT_GROUPS = ['auth.','character.','shop.','market.','raid.','skill.','stat.','house.','wagon.','feedback.','admin.'];
function showAudit(uid){
  closeModal();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t==='audit'));
  ['overview','players','items','activity','audit'].forEach(t => $('#'+t).hidden = t !== 'audit');
  loadAudit(uid);
}
async function loadAudit(uid, action=''){
  const prev = $('#au-user');
  if (uid === undefined) uid = prev ? prev.value : '';
  if (action === '' && $('#au-action')) action = $('#au-action').value;
  const qs = new URLSearchParams({ limit: 200 });
  if (uid) qs.set('userId', uid);
  if (action) qs.set('action', action);
  const d = await api('/api/admin/audit?' + qs);
  const who = (id, n) => id ? `<span class="nm">${esc(n)}</span> <span class="mono" style="font-size:.62rem;color:var(--ash)">#${id}</span>` : '<span style="color:var(--ash)">—</span>';
  const meta = m => m ? `<span class="mono" style="font-size:.66rem;color:var(--ash);word-break:break-word">${esc(JSON.stringify(m))}</span>` : '';
  $('#audit').innerHTML = `<div class="bar">
    <input id="au-user" type="number" min="1" placeholder="Player ID (actor or target)" value="${esc(uid||'')}" style="max-width:240px">
    <select id="au-action" style="max-width:200px"><option value="">All actions</option>
      ${AUDIT_GROUPS.map(g=>`<option value="${g}" ${g===action?'selected':''}>${g}*</option>`).join('')}</select>
    <button class="btn" id="au-go">Filter</button></div>
  <div class="wrap"><table><thead><tr><th>When</th><th>Player</th><th>Action</th><th>Target</th><th>Details</th><th>IP</th></tr></thead><tbody>
  ${d.entries.map(e=>`<tr><td class="mono" style="font-size:.7rem;white-space:nowrap">${fmt(e.createdAt)}</td>
    <td>${who(e.userId, e.userName)}</td>
    <td><span class="tag ${e.action.includes('denied')||e.action.startsWith('admin.')?'bad':''}" style="margin-left:0">${esc(e.action)}</span></td>
    <td>${who(e.targetUserId, e.targetName)}</td><td>${meta(e.metadata)}</td>
    <td class="mono" style="font-size:.66rem;color:var(--ash)" title="${esc(e.userAgent||'')}">${esc(e.ip||'')}</td></tr>`).join('')
    || '<tr><td colspan="6"><i style="color:var(--ash)">No audit entries match.</i></td></tr>'}
  </tbody></table></div>`;
  $('#au-go').onclick = () => loadAudit($('#au-user').value, $('#au-action').value || '');
  $('#au-user').onkeydown = e => { if (e.key==='Enter') $('#au-go').click(); };
}

(async () => {
  try { ME = await api('/api/admin/me'); } catch (e) {}
  const tag = document.createElement('span'); tag.className = 'tag'; tag.style.marginLeft = '.8rem'; tag.textContent = ME.role.toUpperCase();
  document.querySelector('h1').appendChild(tag);
  loadOverview();
})();
</script>
</body>
</html>
